<script>
        google.script.run.withSuccessHandler(showData).getData();

        function showData(dataArray) {
            $(document).ready(function(){
                // Hiển thị bảng dữ liệu gốc
                $('#data-table').DataTable({
                    data: dataArray,
                    columns: [
                        {"title":"Ngày giờ"},
                        {"title":"Nhiệt độ",
                            "render": function(data, type, row, meta){
                                if(type === 'display'){
                                    data = parseFloat(data).toFixed(1); // Làm tròn đến 1 chữ số thập phân
                                }
                                return data;
                            }
                        },
                        {"title":"Độ ẩm",
                            "render": function(data, type, row, meta){
                                if(type === 'display'){
                                    data = parseFloat(data).toFixed(1); // Làm tròn đến 1 chữ số thập phân
                                }
                                return data;
                            }
                        },
                        {"title":"Lượng bụi mịn",
                            "render": function(data, type, row, meta){
                                if(type === 'display'){
                                    data = parseFloat(data).toFixed(1); // Làm tròn đến 1 chữ số thập phân
                                }
                                return data;
                            }
                        }
                    ]
                });

                // Lấy dữ liệu trung bình theo ngày từ getDataAvg
                google.script.run.withSuccessHandler(showAverageData).getDataAvg();
            });
        }

        // Function to load average data per day and display it in the "Trung bình theo ngày" table
function showAverageData(averageArray) {
    $(document).ready(function() {
        // Hiển thị bảng trung bình theo ngày
        $('#average-table').DataTable({
            data: averageArray,
            columns: [
                {"title":"Ngày"},
                {"title":"Nhiệt độ (°C)"},
                {"title":"Độ ẩm (%)"},
                {"title":"Lượng bụi mịn (ug/m3)"}
            ]
        });

        // Tạo dữ liệu cho các biểu đồ
        var dates = averageArray.map(function(item) { return item[0]; });
        var avgTemps = averageArray.map(function(item) { return parseFloat(item[1]); });
        var avgHumis = averageArray.map(function(item) { return parseFloat(item[2]); });
        var avgDusts = averageArray.map(function(item) { return parseFloat(item[3]); });

        // Biểu đồ Nhiệt độ Trung Bình
        var ctxTemp = document.getElementById('temperatureChart').getContext('2d');
        var temperatureChart = new Chart(ctxTemp, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [{
                    label: 'Nhiệt độ Trung Bình (°C)',
                    data: avgTemps,
                    fill: false,
                    borderColor: 'rgba(255, 99, 132, 1)',
                    tension: 0.1
                }]
            }
        });

        // Biểu đồ Độ ẩm Trung Bình
        var ctxHumi = document.getElementById('humidityChart').getContext('2d');
        var humidityChart = new Chart(ctxHumi, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [{
                    label: 'Độ ẩm Trung Bình (%)',
                    data: avgHumis,
                    fill: false,
                    borderColor: 'rgba(54, 162, 235, 1)',
                    tension: 0.1
                }]
            }
        });

        // Biểu đồ Lượng bụi mịn Trung Bình
        var ctxDust = document.getElementById('dustChart').getContext('2d');
        var dustChart = new Chart(ctxDust, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [{
                    label: 'Lượng bụi mịn Trung Bình (ug/m3)',
                    data: avgDusts,
                    fill: false,
                    borderColor: 'rgba(75, 192, 192, 1)',
                    tension: 0.1
                }]
            }
        });
    });
}

</script>

</body>
</html>
